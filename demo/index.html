<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloakNDA - Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        .encrypted-text {
            font-family: 'Courier New', monospace;
            background: linear-gradient(45deg, #1f2937, #374151);
            color: #10b981;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #10b981;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-900 to-slate-800 min-h-screen text-white">
    <!-- Header -->
    <header class="bg-slate-950 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                    🔐 CloakNDA
                </h1>
                <p class="text-sm text-slate-400">Confidential NDA Management with fhEVM</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-green-500 w-3 h-3 rounded-full"></div>
                <span class="text-sm text-slate-300">Demo Mode</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Role Selector -->
        <div class="mb-6 flex gap-2 justify-center">
            <button onclick="switchRole('creator')" id="creator-btn"
                class="px-6 py-3 rounded-lg font-medium transition bg-blue-500 text-white">
                👨‍💼 Creator
            </button>
            <button onclick="switchRole('counterparty')" id="counterparty-btn"
                class="px-6 py-3 rounded-lg font-medium transition bg-slate-700 text-slate-300 hover:bg-slate-600">
                🤝 Counterparty
            </button>
            <button onclick="switchRole('auditor')" id="auditor-btn"
                class="px-6 py-3 rounded-lg font-medium transition bg-slate-700 text-slate-300 hover:bg-slate-600">
                🔍 Auditor
            </button>
        </div>

        <!-- Demo Interface -->
        <div id="demo-content" class="bg-slate-800 rounded-lg p-6">
            <!-- Creator Interface -->
            <div id="creator-interface" class="space-y-6">
                <h2 class="text-xl font-semibold mb-4">Create New NDA</h2>

                <div class="grid md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">NDA Title</label>
                            <input type="text" id="nda-title" placeholder="Software Development NDA"
                                class="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-white">
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-2">Counterparty Address</label>
                            <input type="text" id="counterparty-address"
                                placeholder="0x742d35Cc6634C0532925a3b8D4C9db96590c6C87"
                                class="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-white font-mono text-sm">
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-2">NDA Terms</label>
                            <textarea id="nda-terms" rows="4" placeholder="Enter confidential NDA terms..."
                                class="w-full p-3 bg-slate-700 border border-slate-600 rounded-lg text-white"></textarea>
                        </div>

                        <button onclick="createNDA()"
                            class="w-full bg-blue-500 hover:bg-blue-600 text-white py-3 px-4 rounded-lg font-medium transition">
                            🔒 Create Encrypted NDA
                        </button>
                    </div>

                    <div class="space-y-4">
                        <h3 class="text-lg font-medium">Encryption Process</h3>
                        <div id="encryption-demo" class="space-y-3">
                            <div class="p-3 bg-slate-700 rounded border-l-4 border-yellow-500">
                                <div class="text-sm text-yellow-400">Step 1: Input Validation</div>
                                <div class="text-xs text-slate-300 mt-1">Checking form data...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="demo.js"></script>
</body>

</html>
